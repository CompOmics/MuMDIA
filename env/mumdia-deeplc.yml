# Portable local environment for the prediction and neural-rescoring sidecars:
# DeepLC retention time (scripts/deeplc_worker.py, scripts/deeplc_finetune.py),
# IM2Deep ion mobility (scripts/im2deep_worker.py),
# MS2PIP fragment intensities (scripts/ms2pip_worker.py) and the nn_torch rescorer
# (scripts/nn_rescore_worker.py, which needs torch, numpy and pyarrow). One
# environment covers all three since MS2PIP 4.2.0, which resolves next to DeepLC
# 4.4.0 and 4.5.0 (4.0.0 needed sqlalchemy<2 and could not). The Docker image builds the same
# tool versions from env/docker-deeplc.yml and env/docker-rescore.yml; this spec is
# the equivalent for a native install.
#
#   conda env create -f env/mumdia-deeplc.yml
#   # then point the config at this env's interpreter, or leave the three
#   # interpreter fields at "auto" with the env activated:
#   #   "predict_frag": { "deeplc_python": ".../envs/mumdia-deeplc/bin/python",
#   #                     "ms2pip_python": ".../envs/mumdia-deeplc/bin/python" }
#   #   "rescore":      { "python":        ".../envs/mumdia-deeplc/bin/python" }
#   #   (on Windows: ...\\envs\\mumdia-deeplc\\python.exe)
#   mumdia doctor --config <your config>
#
# DeepLC 4.5.0 is the engine's floor, not merely the current release. The 4.0.0a2
# multitask preview overfits per-run fine-tuning badly enough to invert RT-model
# rankings (docs/08_rt_im_train.md section 4b), the multi-head calibration needs
# 4.4.0 and the default projection cache 4.5.0. 4.5.0 requires Python >= 3.11 and
# torch >= 2.6.
#
# CPU torch is deliberate: DeepLC fine-tuning is not the bottleneck in a run, and
# a CPU wheel keeps the environment installable on machines without CUDA. Drop the
# `--extra-index-url` line and the `+cpu` suffix to use a GPU build instead.
#
# `psm_utils` and `pyarrow` are listed explicitly because `deeplc_finetune.py`
# imports both directly (see `mumdia doctor`, which probes
# deeplc,numpy,pandas,pyarrow,torch,psm_utils for this interpreter). DeepLC pulls
# psm_utils itself, but naming it here keeps the contract visible.
#
# IM2Deep (scripts/im2deep_worker.py) predicts a FASTA library's 1/K0 when
# `predict_frag.im_predictor` asks for it. It is torch-backed and imports DeepLC itself,
# so it shares this environment: im2deep 2.0.2 with deeplc 4.5.0, ms2pip 4.2.0, torch
# 2.14.0+cpu, psm-utils and pyarrow resolve and import together on Python 3.11 (verified
# 2026-10-13: numpy 2.4.6, pandas 2.3.3, pyarrow 26.0.0). 2.0.0 is the engine's floor
# (`MIN_IM2DEEP_VERSION`): the `im2deep.predict` / `im2deep.ccs2im` API the worker calls.
#
# Import order caveat, not expressible in this file: `deeplc` must be imported
# before numpy/pyarrow in the workers, or torch DLL initialization aborts on
# Windows with `OSError: [WinError 1114] ... c10.dll`. Both workers already order
# their imports that way; keep them that way (docs/13_sidecars.md, CLAUDE.md).
name: mumdia-deeplc
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.14.0+cpu
      # >= 83 closes PYSEC-2026-3447; torch 2.12.1 capped setuptools below 82 and
      # would have forced the affected version back in.
      - setuptools>=83
      - deeplc==4.5.0
      # The version behind the FASTA-mode measurements in docs/28 section 22 (HCDch2).
      - ms2pip==4.2.0
      - im2deep>=2.0.0
      - psm-utils
      - pyarrow
