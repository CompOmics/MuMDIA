# Conda env "rescore" for the MuMDIA Docker image: mokapot (rescoring) + MS2PIP
# (fragment-intensity prediction). Only the two tools are version-anchored; their
# scientific-Python dependencies are left to pip so it resolves builds that exist
# for the interpreter (exact older pins like pandas 1.5.3 have no cp312 conda
# build). Built into the image as /opt/conda/envs/rescore; the baked
# docker/config.dia.json points rescore.python and predict_frag.ms2pip_python at
# its interpreter.
# python 3.11: mokapot/ms2pip pull pandas<2, which has no cp312 wheel (would
# force a fragile source build); 3.11 has prebuilt wheels for the whole graph.
name: rescore
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - "numpy<2"
      - pyarrow
      - scikit-learn
      - mokapot==0.10.0
      - ms2pip==4.0.0.dev9
