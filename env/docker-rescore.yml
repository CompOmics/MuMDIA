# Conda env "rescore" for the MuMDIA Docker image: mokapot (rescoring) + MS2PIP
# (fragment-intensity prediction). Pins mirror the validated recipe. Built into
# the image as /opt/conda/envs/rescore; the baked docker/config.dia.json points
# rescore.python and predict_frag.ms2pip_python at its interpreter.
name: rescore
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy=1.26.4
  - pandas=1.5.3
  - pyarrow=17.0.0
  - scikit-learn=1.5.1
  - xgboost=1.7.6
  - pip
  - pip:
      - mokapot==0.10.0
      - ms2pip==4.0.0.dev9
