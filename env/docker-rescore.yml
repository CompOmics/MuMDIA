# Conda env "rescore" for the MuMDIA Docker image: mokapot (rescoring) + MS2PIP
# (fragment-intensity prediction). Only the two tools are version-anchored; their
# scientific-Python dependencies are left to pip so it resolves builds that exist
# for the interpreter (exact older pins like pandas 1.5.3 have no cp312 conda
# build). Built into the image as /opt/conda/envs/rescore; the baked
# docker/config.dia.json points rescore.python and predict_frag.ms2pip_python at
# its interpreter.
# python 3.11: mokapot/ms2pip pull pandas<2, which has no cp312 wheel (would
# force a fragile source build); 3.11 has prebuilt wheels for the whole graph.
name: rescore
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # setuptools >= 83.0.0 closes PYSEC-2026-3447 (CVE-2026-59890: FileList ignored
  # MANIFEST.in exclusion patterns). Pinned here because the CI audit runs against
  # the RESOLVED environment, and a solve that carried 81.0.0 failed the main branch
  # on 2026-09-06.
  - setuptools>=83
  - pip:
      - "numpy<2"
      - pyarrow
      - scikit-learn
      - mokapot==0.10.0
      # 4.0.0 final, not the 4.0.0.dev9 pre-release this used to pin. A .dev build in
      # a published image is a supportability problem: it can be yanked and carries no
      # stability promise. This is the released version of exactly what was pinned, so
      # it is the smallest correct change; 4.1.x and 4.2.0 exist and are a separate,
      # testable upgrade.
      - ms2pip==4.0.0
