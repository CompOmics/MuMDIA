# Conda env "deeplc" for the MuMDIA Docker image: DeepLC 4.0 (multitask,
# PR #99, pinned commit) + a CPU-only PyTorch. Pins mirror the validated
# deeplc_mt env exactly. Built into the image as /opt/conda/envs/deeplc; the
# baked docker/config.dia.json points predict_frag.deeplc_python at its
# interpreter. The multitask model weight ships inside the DeepLC package, so no
# separate model download is needed.
name: deeplc
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.12.1+cpu
      - torchvision==0.27.1+cpu
      - numpy==1.26.4
      - pandas==1.5.3
      - pyarrow==17.0.0
      - psm-utils==1.5.5
      - onnx2torch==1.5.15
      - deeplcretrainer==1.0.0
      - deeplc @ git+https://github.com/CompOmics/DeepLC.git@5c6a94e3a0d1f22a6b237642c21b97b918b10fc0
