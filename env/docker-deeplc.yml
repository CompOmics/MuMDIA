# Conda env "deeplc" for the MuMDIA Docker image: DeepLC 4.1.1 from PyPI plus a
# CPU-only PyTorch. Both are pinned; DeepLC pulls its own scientific-Python
# dependencies (numpy, pandas, scikit-learn, psm-utils) at compatible versions,
# and its model weights ship inside the package, so nothing is downloaded at run
# time. Built into the image as /opt/conda/envs/deeplc; the baked
# docker/config.dia.json points predict_frag.deeplc_python at its interpreter.
#
# 4.1.1 is a floor, not merely the current version: the 4.0.0a2 multitask preview
# overfits per-run fine-tuning badly enough to invert RT-model rankings
# (docs/08_rt_im_train.md section 4b), so an older DeepLC changes results rather
# than only performance. DeepLC 4.1.1 requires Python >= 3.11 and torch >= 2.6.
name: deeplc
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # setuptools >= 83.0.0 closes PYSEC-2026-3447 (CVE-2026-59890: FileList ignored
  # MANIFEST.in exclusion patterns). Pinned here because the CI audit runs against
  # the RESOLVED environment, and a solve that carried 81.0.0 failed the main branch
  # on 2026-09-06.
  - setuptools>=83
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.12.1+cpu
      - pyarrow
      - deeplc==4.1.1
