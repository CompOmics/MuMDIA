# Conda env "deeplc" for the MuMDIA Docker image: DeepLC 4.0 (multitask, PR #99,
# pinned commit) + a CPU-only PyTorch. torch and the DeepLC commit are anchored;
# DeepLC pulls its own scientific-Python dependencies (numpy, pandas, psm-utils,
# deeplcretrainer, onnx2torch) at compatible versions. The multitask model weight
# ships inside the DeepLC package, so no separate download is needed. Built into
# the image as /opt/conda/envs/deeplc; the baked docker/config.dia.json points
# predict_frag.deeplc_python at its interpreter.
name: deeplc
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.12.1+cpu
      - "numpy<2"
      - pyarrow
      - deeplc @ git+https://github.com/CompOmics/DeepLC.git@5c6a94e3a0d1f22a6b237642c21b97b918b10fc0
