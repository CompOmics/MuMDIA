[package]
name = "mumdia_rs"
version = "0.1.0"
edition = "2021"
description = "Rust-accelerated numerical functions for MuMDIA proteomics pipeline"

[lib]
name = "mumdia_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = "0.23"
ndarray = "0.16"
quick-xml = "0.37"
base64 = "0.22"
flate2 = "1.1"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
