[workspace]
resolver = "2"
members = ["crates/mumdia-core", "crates/mumdia-io", "crates/mumdia"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Tracks rust-toolchain.toml, which is the only Rust version CI builds and tests.
# A lower floor may well work, but claiming one we do not verify is a guess; lower
# this together with an MSRV job that proves it.
rust-version = "1.96"
license = "Apache-2.0"
authors = ["CompOmics"]
description = "MuMDIA: a data-independent-acquisition (DIA) proteomics search engine"
repository = "https://github.com/CompOmics/MuMDIA"
homepage = "https://github.com/CompOmics/MuMDIA"
keywords = ["proteomics", "mass-spectrometry", "dia", "bioinformatics"]
categories = ["science", "command-line-utilities"]
# Not published to crates.io: mumdia-core and mumdia-io are internal boundaries of
# one application, not libraries with independent consumers, and the binary needs
# the Python sidecars and configs that a crate cannot carry. Distribution is the
# GitHub release archive and the container image.
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
blake3 = "1"
rayon = "1"
clap = { version = "4", features = ["derive"] }
arrow = { version = "59", features = ["prettyprint"] }
# Pure-Rust build: drop C zlib-ng (needs cmake); SNAPPY codec is pure Rust.
parquet = { version = "59", default-features = false, features = ["arrow", "snap"] }
# Pure-Rust zlib backend (miniz_oxide) instead of zlib-ng-compat (needs cmake).
mzdata = { version = "0.65", default-features = false, features = ["mzml", "miniz_oxide"] }
# Per-thread-arena allocator. The extraction accumulation is allocation-heavy and only
# scaled ~1.07x across cores under the Windows system allocator's shared heap lock;
# mimalloc is pure Rust (no cmake) and removes that serialisation. No behaviour change.
mimalloc = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
# Release archives shipped unstripped debug symbols, which is most of the binary
# size for no user benefit; a backtrace still names the functions.
strip = "symbols"
# Cross-crate inlining. "thin" keeps build times reasonable while still letting the hot
# per-fragment/per-candidate loops inline across the io/core crate boundaries.
lto = "thin"
codegen-units = 1

# arrow-ipc's generated flatbuffer code reliably crashes rustc codegen at
# opt-level 3 on this Windows toolchain (STATUS_ILLEGAL_INSTRUCTION). MuMDIA
# never uses Arrow IPC, so compile just this crate at a lighter opt-level.
[profile.release.package.arrow-ipc]
opt-level = 1
