[package]
name = "mumdia"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true
description = "MuMDIA command-line DIA proteomics search engine"

[[bin]]
name = "mumdia"
path = "src/main.rs"

[dependencies]
mumdia-core = { path = "../mumdia-core" }
mumdia-io = { path = "../mumdia-io" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
blake3.workspace = true
rayon.workspace = true
clap.workspace = true
arrow.workspace = true
parquet.workspace = true
mzdata.workspace = true
mimalloc.workspace = true
# Heap profiler, off by default. `--features dhat-heap` swaps the global allocator for
# dhat's and writes dhat-heap.json (per-call-site bytes and the peak), which is the only
# way to attribute a stage peak to allocation sites rather than to the buffers memlog
# names explicitly. Costs a large slowdown, so profile a truncated input.
dhat = { version = "0.3", optional = true }

[features]
dhat-heap = ["dep:dhat"]

[lints]
workspace = true
