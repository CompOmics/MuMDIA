[package]
name = "mumdia-console"
version = "0.1.0"
edition = "2021"
description = "Desktop interface for the MuMDIA DIA search engine"
license = "Apache-2.0"
publish = false

[lib]
name = "mumdia_console"
path = "src/lib.rs"

# The Tauri shell. Named with a hyphen because that is the executable users see;
# the library keeps the underscore Rust requires.
[[bin]]
name = "mumdia-console"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Fetching the one pinned DIA-NN release the user may opt into. `ureq` rather than
# `reqwest` because this is a single blocking download on a background thread and
# does not justify pulling in tokio; rustls rather than native-tls so the Linux
# bundle does not acquire an OpenSSL runtime dependency.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# The downloaded bytes are executed, so they are checksummed against a pinned
# digest first.
sha2 = "0.10"
# Unpacking the ThermoRawFileParser release, which is a zip. Pure Rust, and
# `deflate` only: shelling out would mean `unzip` on Linux and `tar`/PowerShell on
# Windows, neither of which is guaranteed present.
zip = { version = "2", default-features = false, features = ["deflate"] }
