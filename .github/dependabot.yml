# Dependency updates. Cargo.lock is tracked and both CI and the Docker build use
# `--locked`, so a dependency only moves when a pull request moves it here.
#
# Grouped, monthly, and capped on purpose: the dependency surface is small (arrow,
# parquet, mzdata, clap, serde, rayon and a handful of leaves) and an unreviewed
# arrow or parquet bump can change artifact encoding, which is a data-format change
# rather than a routine upgrade. Every bump still has to pass the full CI gate.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /rust/mumdia
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # The Arrow/Parquet pair must move together: they share a version line, and
      # the engine's on-disk contract (snappy, utf8, list columns) rides on them.
      arrow-parquet:
        patterns:
          - arrow*
          - parquet*
      # Everything else, batched so review is one pull request rather than ten.
      rust-minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - arrow*
          - parquet*
        update-types:
          - minor
          - patch

  # Base images, so the digest pins in the Dockerfile stay current instead of
  # freezing the image on a base that stops receiving security updates. Pinning
  # without an update path is how a reproducible image becomes an unpatched one.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  # No `pip` entry, deliberately. The Python dependency surface lives in the pip
  # sections of the conda specifications under `env/`, which Dependabot does not
  # parse: its pip ecosystem reads requirements.txt, pyproject.toml, Pipfile or
  # poetry.lock. Adding a mirror requirements file to satisfy the scanner would
  # create a second list that nothing installs and that drifts from the one that
  # does, which is worse than no entry.
  #
  # What covers the gap meanwhile: the `sidecar-imports` CI job resolves both
  # environments for real and runs `pip-audit` over them, so a known
  # vulnerability in a sidecar dependency fails a build. The permanent fix is
  # `scripts/pyproject.toml` (docs/22, WP4), after which a `pip` entry pointing
  # at /scripts belongs here.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
