name: Release

# Dormant until a version tag is pushed, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# Then builds a release binary per platform and the desktop installers, keeps every file
# as a workflow artifact, and only when ALL of them built attaches them to the GitHub
# Release for that tag in one job (`publish`), together with the notes. It also builds,
# smoke-tests and pushes the container image (docker.yml), behind the same gate.
#
# The release itself: push the tag alone and `publish` creates it, or save a DRAFT
# release for the tag first and `publish` fills and publishes it. A release already
# published by hand is marked pre-release by `hold-release` until every file is attached,
# so it never shows as "Latest" half filled (docs/14, "Release workflow").
#
# The archive is a working installation, not just an executable: MuMDIA's ML
# predictors and rescorers are Python sidecars that the engine launches by path,
# so a binary on its own cannot fine-tune retention times or rescore with
# mokapot or the neural network. scripts/, env/ and the example configs ship
# alongside it, and the checksum file lets a user verify what they downloaded.
on:
  push:
    tags: ["v*"]
  # Rehearsal. This workflow had never executed: there is no `v*` tag in the
  # repository, so the first `v0.1.0` push would have been the first run of every
  # step in it -- including the packaging, which now stages THIRD_PARTY_LICENSES.md
  # and prunes two working documents, and the checksum step. A release path that has
  # never run is not a release path.
  #
  # A dispatch run builds, packages and verifies the archives, the installers and the
  # image, keeps the files as workflow ARTIFACTS, and publishes nothing: the gate, the
  # hold, `publish` and the image push run on a tag ref only.
  workflow_dispatch:
    inputs:
      version_name:
        description: >-
          Name to stamp into the archive filenames for this rehearsal
          (a real tag run uses the tag name).
        required: false
        default: dryrun

# Least privilege per job, not one write token for the whole workflow: only the
# job that publishes needs `contents: write`, and the gate below needs to READ
# workflow runs, which `contents` does not grant at all.
permissions:
  contents: read

jobs:
  # A `v*` tag could publish any commit, from any branch, with no CI behind it. The
  # workflow's own checks were `--version`, `--help` and `doctor`, and a tag push does
  # not trigger `ci.yml` at all, which only covers pull requests and pushes to `main`.
  #
  # This job is the gate. Every build job depends on it, so a tag that fails any check
  # below publishes nothing. Skipped for a rehearsal, which has no tag to validate.
  validate-tag:
    name: validate the tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for the `ci.yml` run lookup below. Without it the API call
      # returns 403 and the gate cannot tell a green commit from an untested one.
      actions: read
    if: startsWith(github.ref, 'refs/tags/v')
    # The CI wait below is bounded at an hour; this is the backstop.
    timeout-minutes: 90
    env:
      # Move with ci.yml's CARGO_AUDIT_VERSION, whose cache this job restores.
      CARGO_AUDIT_VERSION: 0.22.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so reachability from `main` can actually be tested.
          fetch-depth: 0

      - name: The tag must match the workspace version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${REF_NAME#v}"
          crate=$(grep -m1 '^version' rust/mumdia/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "tag=$tag workspace=$crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag v$tag does not match the workspace version $crate."
            echo "Bump rust/mumdia/Cargo.toml or retag; a release whose archive reports a"
            echo "different version than its tag is not traceable."
            exit 1
          fi
          # The installers take their version from the desktop crate (tauri.conf.json
          # has none, so Tauri reads src-tauri/Cargo.toml).
          desktop=$(grep -m1 '^version' desktop/src-tauri/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "desktop=$desktop"
          if [ "$tag" != "$desktop" ]; then
            echo "::error::tag v$tag does not match the desktop version $desktop."
            echo "Bump desktop/src-tauri/Cargo.toml with rust/mumdia/Cargo.toml."
            exit 1
          fi

      - name: The tagged commit must be reachable from main
        run: |
          set -euo pipefail
          git fetch -q origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::the tagged commit is not an ancestor of origin/main."
            echo "Releases come from main, which is protected and requires CI; tagging a"
            echo "side branch bypasses both."
            exit 1
          fi
          echo "reachable from main: yes"

      - name: CI must have passed for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          # The CI workflow's conclusion for this SHA, not for the branch tip. A tag
          # push does not run ci.yml, so without this the only evidence a release
          # rests on is that someone believed it was fine.
          #
          # A tag pushed right after the merge arrives before main's run has finished,
          # or before it exists at all, so wait for it (up to an hour) instead of
          # failing: while there is no run yet, or one is not completed, poll every
          # minute. Any successful run passes; all runs completed without one fails.
          deadline=$((SECONDS + 3600))
          while :; do
            runs=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$sha&per_page=20" \
                   --jq '[.workflow_runs[] | "\(.status):\(.conclusion)"] | join(",")')
            echo "ci.yml runs for $sha: ${runs:-<none>}"
            case ",$runs," in
              *",completed:success,"*) echo "CI passed for this commit"; break ;;
            esac
            if [ -n "$runs" ] && ! printf '%s\n' "$runs" | tr ',' '\n' | grep -qv '^completed:'; then
              echo "::error::no successful ci.yml run for $sha."
              echo "Push the commit to a PR, let CI pass, merge to main, then tag; or re-run"
              echo "the failed CI jobs and then re-run this workflow."
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::ci.yml for $sha did not finish within an hour."
              exit 1
            fi
            sleep 60
          done

      # CI tolerates a THIRD_PARTY_LICENSES.md or sbom.cdx.json that differs from the
      # lockfile in crate versions only, because Dependabot does not run the generators
      # (ci/_lockfile_versions.py). A release must name the exact versions inside the
      # binary it ships, so the gate compares exactly. The generators read the crate
      # sources from the registry, hence the fetch.
      - name: The licence notices and the SBOM name the exact versions
        run: |
          set -euo pipefail
          cargo fetch --locked --manifest-path rust/mumdia/Cargo.toml
          cargo fetch --locked --manifest-path desktop/Cargo.toml
          python3 ci/gen_third_party_licenses.py --check --strict
          python3 ci/gen_third_party_licenses.py --desktop --check --strict
          python3 ci/gen_sbom.py --check --strict

      # The advisory scan is advisory on most pull requests (ci.yml, `cargo audit`), so
      # an advisory can sit unhandled on main. Here it is strict: a release cannot ship
      # one nobody handled.
      - name: Restore cargo-audit
        id: audit-bin
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ env.CARGO_AUDIT_VERSION }}

      - name: Install cargo-audit
        if: steps.audit-bin.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked --force

      - name: No unhandled advisory
        run: bash ci/cargo_audit.sh

  # A release the maintainer published by hand before pushing the tag is public while
  # the builds run, and stays public if one of them fails. Mark it pre-release, so it is
  # not shown as "Latest" until `publish` has attached every file; `publish` clears the
  # mark. The marker in the body makes a re-run see its own hold rather than a
  # deliberate pre-release, which is left alone, as is a draft (not public).
  hold-release:
    name: hold a published release
    needs: [validate-tag]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Mark a published release as pre-release until its files are attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          MARKER: "<!-- release.yml: held until every file is attached -->"
        run: |
          set -euo pipefail
          if ! state=$(gh release view "$TAG" --repo "$REPO" --json isDraft,isPrerelease \
                       --jq '"\(.isDraft) \(.isPrerelease)"' 2>/dev/null); then
            echo "no release for $TAG yet; publish will create it"
            exit 0
          fi
          echo "release $TAG: draft prerelease = $state"
          if [ "$state" = "false false" ]; then
            body=$(gh release view "$TAG" --repo "$REPO" --json body --jq .body)
            printf '%s\n\n%s\n' "$MARKER" "$body" > held-body.txt
            gh release edit "$TAG" --repo "$REPO" --prerelease --notes-file held-body.txt
            echo "::notice::release $TAG was public; marked pre-release until publish finishes"
          fi

  release:
    name: ${{ matrix.target }}
    needs: [validate-tag]
    permissions:
      # Builds only; `publish` attaches the files.
      contents: read
    # `always()` because `validate-tag` is SKIPPED on a rehearsal (it has no tag to
    # validate) and a skipped dependency would otherwise skip this job too.
    #
    # The condition allows exactly two outcomes, rather than excluding 'failure':
    # a cancelled gate is not a failed gate, and treating it as permission to build
    # would let a tag publish with the checks half-run.
    if: always() && contains(fromJSON('["success", "skipped"]'), needs.validate-tag.result)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Three targets, each built on a runner that executes its own binary, so every
      # archive is verified before it is published.
      #
      # `x86_64-apple-darwin` was here and is deliberately gone. It needed the
      # `macos-13` label, which no longer receives a runner: measured 2026-08-28, that
      # job sat queued for over two hours in two separate rehearsals while every other
      # target finished in about three minutes, with no runner ever assigned. A real
      # tag would have hung until GitHub's 24-hour QUEUE timeout and then failed the
      # release; one of the cancelled rehearsal jobs was observed reporting exactly
      # `24h0m0s`. Note that is the queue limit, not the six-hour limit on a job that
      # is actually running: nothing ever started. The
      # alternative was cross-compiling it on the arm64 runner, which produces an
      # archive that cannot be executed there and so cannot be verified; a published
      # binary nobody has run is what this workflow now exists to prevent. Intel Mac
      # users build from source or use the container image.
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            exe: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            exe: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: ".exe"
    defaults:
      run:
        working-directory: rust/mumdia
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install musl tools (linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --bin mumdia --target ${{ matrix.target }}

      # A binary that cannot run the pipeline is not a release. Fail here rather
      # than shipping an archive whose --version or --help is broken.
      - name: Smoke-test the binary
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/mumdia${{ matrix.exe }}"
          "$bin" --version
          "$bin" --help >/dev/null
          "$bin" doctor >/dev/null

      - name: Package
        shell: bash
        # `github.ref_name` reaches the script through the environment, not through
        # `${{ }}` interpolation into a `run:` line. Git ref names may contain `;`,
        # backticks, `$`, `&` and `|`, so a crafted tag was a shell injection. Pushing a
        # tag needs write access, so this is defence in depth rather than an open door,
        # but the fix costs nothing.
        env:
          # On a tag run this is the tag; on a rehearsal it is the supplied name, so
          # the archive is named `mumdia-dryrun-<target>` and cannot be mistaken for a
          # real release artifact.
          REF_NAME: >-
            ${{ github.event_name == 'workflow_dispatch'
                && (inputs.version_name || 'dryrun')
                || github.ref_name }}
        run: |
          set -euo pipefail
          name="mumdia-$REF_NAME-${{ matrix.target }}"
          stage="dist/$name"
          root=../..
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/mumdia${{ matrix.exe }}" "$stage/"
          # Documentation and licence.
          # THIRD_PARTY_LICENSES.md is not optional: the binary is statically
          # linked, so it contains 173 third-party crates whose Apache-2.0 and MIT
          # terms require their notices to travel with it.
          # sbom.cdx.json travels with the binary for the same reason, one reader
          # further along: a scanner or a software inventory needs the exact
          # component versions inside the artifact it has, not inside the
          # repository it does not have.
          cp "$root/README.md" "$root/LICENSE" "$root/CHANGELOG.md" \
             "$root/THIRD_PARTY_LICENSES.md" "$root/sbom.cdx.json" "$stage/"
          cp -r "$root/docs" "$stage/docs"
          # The release plan and the pre-release audit are working documents about
          # getting to this release: they state which gates were failing, what was
          # blocked, and unpublished benchmark numbers. Useful in the repository,
          # odd inside the archive of the release they plan.
          rm -f "$stage/docs/22_release_plan.md" \
                "$stage/docs/25_release_readiness_review.md"
          # The Python sidecars the engine invokes, and the environment specs that
          # make them installable. Without these the binary is native-only.
          cp -r "$root/scripts" "$stage/scripts"
          cp -r "$root/env" "$stage/env"
          # Example configurations, if the tag carries them.
          if [ -d "$root/configs" ]; then cp -r "$root/configs" "$stage/configs"; fi
          # The verification procedure the packaged docs/19 tells users to run. It was
          # documented and not shipped: `ci/` and `test_data/` were excluded, so the
          # archive's own getting-started guide could not be followed from the archive.
          # Only the three scripts the smoke test needs; the `gen_*` generators and the
          # documentation-reference checker are development tooling that needs the
          # repository and would be meaningless here.
          mkdir -p "$stage/ci" "$stage/test_data"
          cp "$root/ci/smoke.sh" "$root/ci/check_smoke.py" \
             "$root/ci/make_fixture_mzml.py" "$stage/ci/"
          cp "$root/test_data/fixture.fasta" "$root/test_data/fixture_nterm.fasta" "$stage/test_data/"
          cd dist
          if [ -n "${{ matrix.exe }}" ]; then
            7z a "$name.zip" "$name" >/dev/null
            archive="$name.zip"
          else
            tar czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          # Portable across the three runners: coreutils on Linux and Git Bash,
          # BSD shasum on macOS.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "--- archive contents ---"
          ls -R "$name" | head -40
          echo "--- checksum ---"
          cat "$archive.sha256"

      # Only a real tag creates a GitHub Release. Without this gate a rehearsal would
      # try to publish a release for a branch ref, which is both wrong and the kind of
      # thing that is only discovered by doing it.
      # Test the ARTIFACT, not the tree it came from. The definition of done in
      # docs/22 asks for exactly this, and it is the only step that can catch a
      # packaging mistake: a missing script, a config that did not travel, a binary
      # that runs from a cargo target directory but not from a clean unpack.
      #
      # Every matrix target runs on a host that executes its own binary natively, so
      # this covers all three -- including macOS, which the repository smoke test does
      # not reach.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Verify the unpacked archive
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pyarrow
          unpacked="$RUNNER_TEMP/unpacked"
          rm -rf "$unpacked"; mkdir -p "$unpacked"
          cd dist
          # Not `ls *.tar.gz *.zip 2>/dev/null | head -1`: exactly one of those globs
          # matches, so `ls` exits 2 on the other, and under `pipefail` plus `set -e`
          # with stderr discarded the step died with no message at all. That is the
          # failure mode docs/14 already records for `cmd && echo` inside a command
          # substitution, and it cost one rehearsal.
          shopt -s nullglob
          archives=(*.tar.gz *.zip)
          shopt -u nullglob
          if [ ${#archives[@]} -eq 0 ]; then
            echo "::error::the Package step produced no archive in dist/"
            ls -la
            exit 1
          fi
          archive="${archives[0]}"
          echo "verifying $archive"
          case "$archive" in
            *.tar.gz) tar xzf "$archive" -C "$unpacked" ;;
            # Python rather than 7z or unzip: the interpreter is already set up above,
            # and it behaves identically on every runner image. Losing the executable
            # bit does not matter, because only the Windows archive is a zip.
            *.zip)    python -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" \
                        "$archive" "$unpacked" ;;
            *) echo "::error::unrecognised archive $archive"; exit 1 ;;
          esac
          root=$(find "$unpacked" -mindepth 1 -maxdepth 1 -type d | head -1)
          if [ -z "$root" ]; then
            echo "::error::the archive did not unpack to a single top-level directory"
            find "$unpacked" -maxdepth 2
            exit 1
          fi
          cd "$root"
          echo "--- the archive must be self-sufficient from here ---"
          ls
          # MUMDIA_BIN is set explicitly for determinism, but `ci/smoke.sh` also
          # discovers `./mumdia` in an unpacked archive on its own, which is what a
          # user following docs/19 relies on.
          # No work-directory argument: the default (`$TMPDIR/mumdia_smoke`) is what
          # the ci.yml smoke job already uses on all three platforms. Passing
          # `$RUNNER_TEMP` would hand a Windows path with backslashes to a bash
          # script, which is a needless difference between the two invocations.
          MUMDIA_BIN="$PWD/mumdia${{ matrix.exe }}" bash ci/smoke.sh

      # Every run, not only a rehearsal: `publish` attaches these to the release once
      # every build has passed, so one failed leg can no longer leave a release with
      # some files and not others.
      - name: Upload archives as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: |
            rust/mumdia/dist/*.tar.gz
            rust/mumdia/dist/*.zip
            rust/mumdia/dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  # The desktop application, built for the two platforms it targets.
  #
  # A separate job rather than steps inside `release`: it needs Node-free but
  # webview-ful build dependencies on Linux, its own cargo workspace, and it must not
  # slow down or fail the engine archives, which are the primary artifact. macOS is
  # deliberately absent -- an unsigned bundle is blocked outright by Gatekeeper, so
  # shipping one would be worse than shipping none.
  desktop:
    name: desktop ${{ matrix.target }}
    needs: [validate-tag]
    if: always() && contains(fromJSON('["success", "skipped"]'), needs.validate-tag.result)
    permissions:
      contents: read
    env:
      # The bundler. ci.yml's desktop-windows job installs, caches and tests the same
      # version under the same name; move the two together.
      TAURI_CLI_VERSION: 2.12.4
    strategy:
      fail-fast: false
      matrix:
        include:
          # GNU, not musl, and measured rather than assumed. The engine's own
          # release archives are musl and stay musl; inside an AppImage they do not
          # survive. `linuxdeploy` runs `patchelf` over every ELF binary it bundles,
          # and a static-pie musl binary comes out with a `RUNPATH [$ORIGIN]` entry
          # injected into it and segfaults immediately. Verified by extracting a
          # built AppImage and running the engine inside it; `uv`, dynamically
          # linked, survived the same treatment untouched.
          #
          # Nothing is lost. musl would buy portability only if the bundle had no
          # other glibc floor, and the Tauri host links WebKitGTK, so the
          # application sets that floor whatever the engine is built against.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            engine_exe: ""
            bundle_glob: "desktop/target/release/bundle/appimage/*.AppImage"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            engine_exe: ".exe"
            bundle_glob: "desktop/target/release/bundle/msi/*.msi"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tauri needs the platform webview headers at build time on Linux. The
      # produced AppImage carries what it needs at runtime.
      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libssl-dev

      # Inside `rust/mumdia`, not at the repository root. That directory pins its
      # toolchain with `rust-toolchain.toml`, and `rustup target add` adds the target
      # to whichever toolchain is active where it runs. From the root it added musl
      # to the DEFAULT toolchain while the build used the pinned one, which then
      # failed with "can't find crate for `core`" and advice to run the command that
      # had just succeeded.
      - name: Add the engine target
        working-directory: rust/mumdia
        run: rustup target add ${{ matrix.target }}

      # The application ships the engine it was built alongside. Building both from
      # one checkout is what makes a version mismatch impossible.
      - name: Build the engine
        working-directory: rust/mumdia
        run: cargo build --release --locked --target ${{ matrix.target }} --bin mumdia

      # Everything the application expects to find beside itself. `binaries/` is
      # where `engine.rs` and `components.rs` look, and `uv` is what installs the
      # analysis components without conda.
      - name: Stage the bundled binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p desktop/src-tauri/binaries/scripts
          cp "rust/mumdia/target/${{ matrix.target }}/release/mumdia${{ matrix.engine_exe }}" \
             desktop/src-tauri/binaries/
          # The Python workers the engine launches by path. `python::resolve_script_dir`
          # accepts a directory only when it holds a worker file, so the bundle needs the
          # files and not just the directory: the 0.1.0 installers shipped an empty
          # `binaries/scripts/` (its README alone) and every sidecar failed at the point
          # of use. The verification step below fails the build if this ever regresses.
          cp scripts/*.py desktop/src-tauri/binaries/scripts/
          # The notices. The engine is statically linked (THIRD_PARTY_LICENSES.md, the
          # SBOM), so is the application (desktop/THIRD_PARTY_LICENSES.md), and uv's
          # archive carries no licence file, so its two texts come from the same tag.
          cp LICENSE THIRD_PARTY_LICENSES.md sbom.cdx.json desktop/src-tauri/binaries/
          cp desktop/THIRD_PARTY_LICENSES.md desktop/src-tauri/binaries/THIRD_PARTY_LICENSES-desktop.txt
          # uv publishes static binaries per platform; take the pinned release rather
          # than whatever `latest` happens to be on the day of a build.
          UV_VERSION=0.10.6
          case "${{ runner.os }}" in
            Linux)   UV_ASSET="uv-x86_64-unknown-linux-gnu.tar.gz" ;;
            Windows) UV_ASSET="uv-x86_64-pc-windows-msvc.zip" ;;
          esac
          curl -fsSL -o uv-asset \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/${UV_ASSET}"
          case "$UV_ASSET" in
            *.tar.gz) tar xzf uv-asset --strip-components=1 -C desktop/src-tauri/binaries ;;
            *.zip)    python -c "import sys,zipfile;zipfile.ZipFile('uv-asset').extractall('desktop/src-tauri/binaries')" ;;
          esac
          for lic in LICENSE-MIT LICENSE-APACHE; do
            curl -fsSL -o "desktop/src-tauri/binaries/uv-$lic" \
              "https://raw.githubusercontent.com/astral-sh/uv/${UV_VERSION}/$lic"
          done
          ls -la desktop/src-tauri/binaries

      # The bundler that produces the .msi and .AppImage. Installed rather than
      # vendored, and pinned to the exact version ci.yml tests the MSI with, so a
      # bundler change arrives as a reviewed version bump.
      - name: Install the Tauri bundler
        run: cargo install tauri-cli --version "=$TAURI_CLI_VERSION" --locked

      # The Microsoft Visual C++ x64 runtime that PyTorch needs on Windows. A machine
      # without a current one cannot load `torch\lib\c10.dll` (`WinError 1114`), so the
      # MSI carries Microsoft's merge module from the runner's Visual Studio
      # (`desktop/src-tauri/wix/vc-runtime.wxs`, desktop/README.md "The Visual C++
      # runtime"). The module itself is checked before the build: a runner image without
      # it, or with one older than PyTorch accepts, fails here rather than shipping an
      # installer that leaves the user's first search to find out.
      - name: Locate the Visual C++ runtime merge module (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msm = & ./ci/find_vc_merge_module.ps1
          if (-not $msm) { Write-Error "no merge module found"; exit 1 }
          Write-Output "merge module: $msm"
          & ./ci/check_msi_runtime.ps1 -Msi $msm
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "TAURI_MUMDIA_VC_CRT_MSM=$msm" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # On Windows the overlay adds the merge module (`tauri.vcruntime.conf.json`); the
      # bundler passes TAURI_* variables, and only those, to WiX, which is how the
      # fragment finds the module.
      - name: Build the installer
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          # `cargo tauri build` resolves without --locked; this fails on a stale lockfile,
          # so the installer ships the crates desktop/Cargo.lock names and CI audited.
          cargo fetch --locked
          if [ "${{ runner.os }}" = "Windows" ]; then
            cargo tauri build --config src-tauri/tauri.vcruntime.conf.json
          else
            cargo tauri build
          fi

      - name: Collect the installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p desktop/dist
          shopt -s nullglob
          found=(${{ matrix.bundle_glob }})
          shopt -u nullglob
          if [ ${#found[@]} -eq 0 ]; then
            echo "::error::the bundler produced no installer"
            find desktop/target/release/bundle -maxdepth 2 -type f || true
            exit 1
          fi
          for f in "${found[@]}"; do
            cp "$f" desktop/dist/
          done
          cd desktop/dist
          for f in *; do
            if command -v sha256sum > /dev/null 2>&1; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done
          ls -la

      # The bundle is opened and inspected before anything is published, for the same
      # reason the engine archives are: the file list is the only check that catches a
      # resource glob satisfied by a README alone, which is exactly how 0.1.0 shipped
      # without its Python workers. The engine inside is also executed, which is what
      # caught the patchelf-broken musl build (desktop/README.md, "Packaging").
      - name: Verify the bundle contents (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = (Get-ChildItem desktop/dist/*.msi | Select-Object -First 1).FullName
          $img = Join-Path $env:RUNNER_TEMP "msi-image"
          # An administrative install unpacks the MSI into a directory without installing.
          $p = Start-Process msiexec.exe -ArgumentList @("/a", "`"$msi`"", "/qn", "TARGETDIR=`"$img`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "msiexec /a exited $($p.ExitCode)"; exit 1 }
          Get-ChildItem -Recurse -File $img | ForEach-Object { $_.FullName.Substring($img.Length + 1) } | Sort-Object
          $app = Get-ChildItem -Recurse -Directory $img |
            Where-Object { Test-Path (Join-Path $_.FullName "mumdia-console.exe") } |
            Select-Object -First 1
          if (-not $app) { Write-Error "the bundle lacks mumdia-console.exe"; exit 1 }
          # Every script the staging step copied, not a hand-kept list.
          $workers = Get-ChildItem scripts/*.py | ForEach-Object { $_.Name }
          $notices = @("LICENSE", "THIRD_PARTY_LICENSES.md", "THIRD_PARTY_LICENSES-desktop.txt",
                       "sbom.cdx.json", "uv-LICENSE-MIT", "uv-LICENSE-APACHE")
          $required = @("binaries\mumdia.exe", "binaries\uv.exe") +
                      ($notices | ForEach-Object { "binaries\$_" }) +
                      ($workers | ForEach-Object { "binaries\scripts\$_" })
          foreach ($r in $required) {
            if (-not (Test-Path (Join-Path $app.FullName $r))) { Write-Error "the bundle lacks $r"; exit 1 }
          }
          & (Join-Path $app.FullName "binaries\mumdia.exe") --version
          if ($LASTEXITCODE -ne 0) { Write-Error "the bundled engine does not run"; exit 1 }
          # The Visual C++ runtime: the merge module's record, the three DLLs PyTorch
          # loads at 14.40 or newer, and their placement in the 64-bit system directory.
          & ./ci/check_msi_runtime.ps1 -Msi $msi
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # The installer's choice of where the analysis components go.
          & ./ci/check_msi_scope.ps1 -Msi $msi
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Verify the bundle contents (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          app=$(ls desktop/dist/*.AppImage)
          work=$(mktemp -d)
          chmod +x "$app"
          (cd "$work" && "$OLDPWD/$app" --appimage-extract > /dev/null)
          root="$work/squashfs-root"
          find "$root/usr" -type f | sed "s|^$root/||" | sort
          [ -x "$root/usr/bin/mumdia-console" ] || { echo "::error::the bundle lacks mumdia-console"; exit 1; }
          lib=$(dirname "$(find "$root/usr/lib" -type f -name mumdia -path "*/binaries/*" | head -1)")
          [ -n "$lib" ] || { echo "::error::the bundle lacks the engine"; exit 1; }
          [ -f "$lib/uv" ] || { echo "::error::the bundle lacks uv"; exit 1; }
          # Every script the staging step copied, not a hand-kept list.
          for f in scripts/*.py; do
            f=$(basename "$f")
            [ -f "$lib/scripts/$f" ] || { echo "::error::the bundle lacks binaries/scripts/$f"; exit 1; }
          done
          for f in LICENSE THIRD_PARTY_LICENSES.md THIRD_PARTY_LICENSES-desktop.txt sbom.cdx.json \
                   uv-LICENSE-MIT uv-LICENSE-APACHE; do
            [ -f "$lib/$f" ] || { echo "::error::the bundle lacks binaries/$f"; exit 1; }
          done
          "$lib/mumdia" --version

      - name: Upload installers as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.target }}
          path: desktop/dist/*
          if-no-files-found: error
          retention-days: 7

  # The container image, behind the same gate as everything else. It used to run on the
  # tag by itself, so a tag the gate refused still pushed :<tag> and moved :latest.
  # docker.yml pushes on a tag ref only; on a rehearsal it builds and smoke-tests.
  docker:
    name: docker image
    needs: [validate-tag]
    if: always() && contains(fromJSON('["success", "skipped"]'), needs.validate-tag.result)
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml

  # The one job that writes to the release, after every archive and installer built
  # and verified. It attaches all files and writes the notes once (each upload job used
  # to append its own copy: v0.10.0 had the "What's Changed" list six times):
  #
  # - no release for the tag: creates it with the files and notes (gh uploads to a
  #   draft and publishes it once the files are there);
  # - a draft: attaches the files, writes the notes and publishes it;
  # - published by hand: attaches the files, writes the notes, and lifts the
  #   pre-release mark `hold-release` set.
  #
  # The notes replace the body, as they did before. If a build fails this job does not
  # run, so nothing is attached; re-running the failed jobs re-runs this one.
  publish:
    name: publish the release
    needs: [hold-release, release, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true

      - name: Attach every file and write the notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          MARKER: "<!-- release.yml: held until every file is attached -->"
        run: |
          set -euo pipefail
          ls -la assets
          test -n "$(ls assets)"
          gh api -X POST "repos/$REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body > release-notes.txt
          test -s release-notes.txt
          if ! state=$(gh release view "$TAG" --repo "$REPO" --json isDraft,body \
                       --jq '"\(.isDraft) \((.body // "") | contains(env.MARKER))"' 2>/dev/null); then
            gh release create "$TAG" assets/* --repo "$REPO" --verify-tag \
              --title "$TAG" --notes-file release-notes.txt
          else
            echo "release $TAG: draft held = $state"
            gh release upload "$TAG" assets/* --repo "$REPO" --clobber
            case "$state" in
              "true "*)    gh release edit "$TAG" --repo "$REPO" --notes-file release-notes.txt --draft=false ;;
              "false true") gh release edit "$TAG" --repo "$REPO" --notes-file release-notes.txt --prerelease=false --latest ;;
              *)           gh release edit "$TAG" --repo "$REPO" --notes-file release-notes.txt ;;
            esac
          fi
          echo "release $TAG: $(ls assets | wc -l) files, $(grep -c "^\* " release-notes.txt || true) notes entries"
