name: Release

# Dormant until a version tag is pushed, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# Then builds a release binary per platform and attaches archives to the
# GitHub Release for that tag.
#
# The archive is a working installation, not just an executable: MuMDIA's ML
# predictors and rescorers are Python sidecars that the engine launches by path,
# so a binary on its own cannot fine-tune retention times or rescore with
# mokapot or the neural network. scripts/, env/ and the example configs ship
# alongside it, and the checksum file lets a user verify what they downloaded.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            exe: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            exe: ""
          - os: macos-13
            target: x86_64-apple-darwin
            exe: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: ".exe"
    defaults:
      run:
        working-directory: rust/mumdia
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install musl tools (linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --bin mumdia --target ${{ matrix.target }}

      # A binary that cannot run the pipeline is not a release. Fail here rather
      # than shipping an archive whose --version or --help is broken.
      - name: Smoke-test the binary
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/mumdia${{ matrix.exe }}"
          "$bin" --version
          "$bin" --help >/dev/null
          "$bin" doctor >/dev/null

      - name: Package
        shell: bash
        # `github.ref_name` reaches the script through the environment, not through
        # `${{ }}` interpolation into a `run:` line. Git ref names may contain `;`,
        # backticks, `$`, `&` and `|`, so a crafted tag was a shell injection. Pushing a
        # tag needs write access, so this is defence in depth rather than an open door,
        # but the fix costs nothing.
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name="mumdia-$REF_NAME-${{ matrix.target }}"
          stage="dist/$name"
          root=../..
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/mumdia${{ matrix.exe }}" "$stage/"
          # Documentation and licence.
          # THIRD_PARTY_LICENSES.md is not optional: the binary is statically
          # linked, so it contains 173 third-party crates whose Apache-2.0 and MIT
          # terms require their notices to travel with it.
          cp "$root/README.md" "$root/LICENSE" "$root/CHANGELOG.md" \
             "$root/THIRD_PARTY_LICENSES.md" "$stage/"
          cp -r "$root/docs" "$stage/docs"
          # The release plan and the pre-release audit are working documents about
          # getting to this release: they state which gates were failing, what was
          # blocked, and unpublished benchmark numbers. Useful in the repository,
          # odd inside the archive of the release they plan.
          rm -f "$stage/docs/22_release_plan.md" \
                "$stage/docs/25_release_readiness_review.md"
          # The Python sidecars the engine invokes, and the environment specs that
          # make them installable. Without these the binary is native-only.
          cp -r "$root/scripts" "$stage/scripts"
          cp -r "$root/env" "$stage/env"
          # Example configurations, if the tag carries them.
          if [ -d "$root/configs" ]; then cp -r "$root/configs" "$stage/configs"; fi
          cd dist
          if [ -n "${{ matrix.exe }}" ]; then
            7z a "$name.zip" "$name" >/dev/null
            archive="$name.zip"
          else
            tar czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          # Portable across the three runners: coreutils on Linux and Git Bash,
          # BSD shasum on macOS.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "--- archive contents ---"
          ls -R "$name" | head -40
          echo "--- checksum ---"
          cat "$archive.sha256"

      - name: Upload to release
        # Pinned to a commit, not the mutable `v2` tag. This is the only
        # third-party action in the tree (the other nine are actions/* and
        # docker/*), it receives the release token and the built archives, and a
        # moved tag would run new code with repository write access on every tag
        # push. Dependabot covers `github-actions`, so the SHA keeps moving on a
        # reviewed PR instead of silently.
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: |
            rust/mumdia/dist/*.tar.gz
            rust/mumdia/dist/*.zip
            rust/mumdia/dist/*.sha256
          generate_release_notes: true
